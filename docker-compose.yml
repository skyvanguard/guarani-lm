services:
  trainer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: guarani-lm:v3
    container_name: guarani-lm-trainer
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HUB_ENABLE_HF_TRANSFER: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "8gb"
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      # Source code + checkpoints + data (RW)
      - .:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: bash
