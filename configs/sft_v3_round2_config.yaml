# SFT v3 round 2 — refines cpt_v3_refine to recover instruction-following
# without losing the language modeling gains. Uses CLEANED dataset (no URLs,
# handles, hashtags, emojis).
#
# Launch when you have ~16h GPU available:
#   docker compose run --rm trainer python3 src/train_sft.py --config configs/sft_v3_round2_config.yaml

model:
  name: "checkpoints/cpt_v3_refine/final"   # build on top of current best model
  load_in_4bit: true
  max_seq_length: 1024
  dtype: null

lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  use_rslora: true

training:
  output_dir: "checkpoints/sft_v3_round2"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 5.0e-6                      # 3x lower than SFT v3-only (1.5e-5)
  warmup_ratio: 0.05
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0
  fp16: false
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 250
  save_total_limit: 4
  seed: 42
  dataloader_num_workers: 2
  report_to: "none"

data:
  train_file: "data/processed/sft_v2_train_clean.jsonl"   # CLEAN
  validation_file: "data/processed/sft_v2_val_clean.jsonl"
  chat_template: "chatml"
  max_length: 1024

sft:
  packing: true
  neftune_noise_alpha: 5

wandb:
  project: "guarani-lm"
  run_name: "sft-v3-round2-clean-1ep"
