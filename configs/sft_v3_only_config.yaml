# SFT v3 (no CPT) — SFT directly on base Qwen2.5-3B.
# Compressed schedule to fit ~10h budget.

model:
  name: "unsloth/Qwen2.5-3B"   # base model, no CPT
  load_in_4bit: true
  max_seq_length: 1024
  dtype: null

lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  use_rslora: true

training:
  output_dir: "checkpoints/sft_v3_only"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16  # effective batch = 16
  learning_rate: 2.0e-5
  warmup_ratio: 0.05
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0
  fp16: false
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 250                  # frequent checkpoints in case of early stop
  save_total_limit: 4
  seed: 42
  dataloader_num_workers: 2
  report_to: "none"

data:
  train_file: "data/processed/sft_v2_train.jsonl"
  validation_file: "data/processed/sft_v2_val.jsonl"
  chat_template: "chatml"
  max_length: 1024

sft:
  packing: true
  neftune_noise_alpha: 5

wandb:
  project: "guarani-lm"
  run_name: "sft-v3-only-qwen3b-1ep"
