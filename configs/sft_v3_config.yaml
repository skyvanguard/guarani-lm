# SFT v3 Configuration
# Loads CPT v3 (Qwen2.5-3B merged) and fine-tunes on 236K instructions.

model:
  name: "checkpoints/cpt_v3/final"
  load_in_4bit: true
  max_seq_length: 2048
  dtype: null

lora:
  r: 32
  lora_alpha: 32
  lora_dropout: 0.0  # Unsloth fast patching requires dropout=0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  use_rslora: true

training:
  output_dir: "checkpoints/sft_v3"
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16  # effective batch = 16
  learning_rate: 1.5e-5
  warmup_ratio: 0.05
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0
  fp16: false
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 500
  save_total_limit: 3
  seed: 42
  dataloader_num_workers: 2
  report_to: "none"

data:
  train_file: "data/processed/sft_v2_train.jsonl"
  validation_file: "data/processed/sft_v2_val.jsonl"
  chat_template: "chatml"
  max_length: 2048

sft:
  # Dataset distribution inherited from v2 (236K instructions):
  # 27.2% cultura_qa, 20.5% instruction_jopara, 16.7% instruction_following,
  # 14.8% translate_es_gn, 14.8% translate_gn_es, ~6% misc.
  packing: true
  neftune_noise_alpha: 5

wandb:
  project: "guarani-lm"
  run_name: "sft-v3-qwen3b-2ep"
